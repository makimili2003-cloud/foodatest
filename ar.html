<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FoodAR</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <script src="/ar-launch.js?v=4"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; font-family: system-ui, sans-serif; }
    model-viewer { width: 100vw; height: 100vh; height: 100dvh; }
    /* Ceo ekran je dugme: jedan dodir bilo gde pokreće AR */
    #tap {
      position: fixed; inset: 0; z-index: 10; border: 0; padding: 0;
      background: rgba(0,0,0,.35); color: #fff; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      padding-bottom: calc(48px + env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }
    #tap span {
      background: #000; padding: 18px 28px; border-radius: 14px;
      font-size: 18px; font-weight: 600;
    }
    #tap small { margin-top: 10px; font-size: 13px; opacity: .85; }
    #tap[hidden] { display: none; }
    #loading { position: fixed; top: 16px; left: 0; right: 0; text-align: center; font-size: 14px; color: #333; z-index: 11; }
    /* Sakrij ugrađeno dugme, koristimo svoje */
    model-viewer::part(default-ar-button) { display: none; }
  </style>
</head>
<body>

<model-viewer
  id="mv"
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-placement="floor"
  xr-environment
  camera-controls
  auto-rotate
  environment-image="neutral"
  shadow-intensity="1"
  exposure="1">
</model-viewer>

<div id="loading">Učitavanje modela…</div>
<button id="tap" hidden>
  <span>Dodirni ekran za AR</span>
  <small>Usmeri kameru ka stolu</small>
</button>

<script>
  const mv = document.getElementById('mv');
  const tap = document.getElementById('tap');
  const loading = document.getElementById('loading');

  // Koje jelo prikazati: poddomen (pizza.foodar.org) ili ?jelo=pizza
  const host = window.location.hostname.toLowerCase();
  const params = new URLSearchParams(location.search);
  let sub = params.get('jelo') || '';
  if (!sub && host.endsWith('.foodar.org')) sub = host.replace('.foodar.org', '');

  // Spisak jela je u dishes.json (ažurira ga admin panel)
  fetch('dishes.json', { cache: 'no-cache' }).then(r => r.json()).then(list => {
    const item = list.find(d => d.sub === sub);
    if (!item || item.hidden) {
      // QR kod nikad ne vodi na grešku: sklonjeno ili nepoznato jelo dobija lepu poruku
      showMessage(item && item.hidden
        ? { title: 'Ovo jelo trenutno nije u ponudi', text: (item.name ? '„' + item.name + '“ ' : '') + 'privremeno nije dostupno. Pitajte osoblje za preporuku iz današnje ponude.' }
        : { title: 'Jelo nije pronađeno', text: 'Ovaj QR kod ne vodi ni na jedno jelo. Pitajte osoblje za pomoć.' });
      return;
    }
    document.title = item.name + ' – FoodAR';
    mv.alt = '3D model: ' + item.name;
    mv.src = item.glb;
    if (item.usdz) mv.iosSrc = item.usdz;   // bez usdz-a model-viewer sam pravi model za iPhone
    if (item.realSize) mv.arScale = 'fixed';
    window.DISH = item;
  }).catch(() => { loading.textContent = 'Greška pri učitavanju. Osvežite stranicu.'; });

  function showMessage({ title, text }) {
    loading.hidden = true; tap.hidden = true; mv.style.display = 'none';
    document.title = title + ' – FoodAR';
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(60% 50% at 80% 0%,#ffd9cb 0%,transparent 70%),#fbf7f1;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1f1a17;text-align:center';
    box.innerHTML = '<div style="max-width:360px"><div style="width:64px;height:64px;border-radius:50%;background:#d9472b;color:#fff;display:grid;place-items:center;margin:0 auto 18px;font:700 18px system-ui">AR</div>' +
      '<h1 style="font:700 26px/1.2 Georgia,serif;margin:0 0 10px"></h1><p style="margin:0 0 22px;color:#6a6058;line-height:1.55"></p>' +
      '<a href="https://foodar.org" style="display:inline-block;padding:13px 22px;border-radius:999px;background:#1f1a17;color:#fff;text-decoration:none;font-weight:600">FoodAR</a></div>';
    box.querySelector('h1').textContent = title; box.querySelector('p').textContent = text;
    document.body.appendChild(box);
  }

  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isMobile = isIOS || /Android/i.test(ua);
  // Instagram/Facebook/TikTok ugrađeni browser: FoodAR.launchAR sam bira način (Scene Viewer na Androidu, Safari na iPhone-u)
  let tried = false;
  function launchAR() {
    if (!FoodAR.canLaunch(mv)) return;
    // iPhone u aplikaciji: prozor sa uputstvom prikaži tek kad gost dodirne ekran
    if (FoodAR.inApp && FoodAR.ios && !tried) { tried = true; return; }
    tried = true;
    FoodAR.launchAR(mv, { title: window.DISH && window.DISH.name, fixedScale: !!(window.DISH && window.DISH.realSize) });
  }

  mv.addEventListener('load', () => {
    loading.hidden = true;
    if (!isMobile) return;          // na računaru samo 3D prikaz
    // Pokušaj odmah (radi gde browser dozvoljava); u suprotnom ostaje veliki taster
    try { launchAR(); } catch (e) {}
    tap.hidden = !FoodAR.canLaunch(mv);
  });

  // Dodir bilo gde na ekranu -> AR
  tap.addEventListener('click', () => { tried = true; launchAR(); });

  // Kada korisnik izađe iz AR-a, ponovo ponudi taster
  mv.addEventListener('ar-status', (e) => {
    if (e.detail.status === 'session-started') tap.hidden = true;
    if (e.detail.status === 'not-presenting' || e.detail.status === 'failed') tap.hidden = !FoodAR.canLaunch(mv);
  });

  mv.addEventListener('error', () => { loading.textContent = 'Greška pri učitavanju modela.'; });
</script>

</body>
</html>
